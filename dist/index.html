        var self = this;
        if (this.profileForm.new_password && this.profileForm.new_password !== this.profileForm.confirm_password) {
          this.$message.error('两次输入的新密码不一致');
          return;
        }
        this.profileSaving = true;
        var payload = {
          id: this.userInfo.id || '',
          real_name: this.profileForm.real_name,
          phone: this.profileForm.phone,
          email: this.profileForm.email
        };
        if (this.profileForm.old_password && this.profileForm.new_password) {
          payload.old_password = this.profileForm.old_password;
          payload.new_password = this.profileForm.new_password;
        }
        api.post(API_PREFIX + '/user/update', payload)
          .then(function(res) {
            if (res.code === 20000) {
              self.$message.success('保存成功');
              self.profileForm.old_password = '';
              self.profileForm.new_password = '';
              self.profileForm.confirm_password = '';
              // 更新顶部用户名
              if (self.profileForm.real_name) {
                self.userInfo.name = self.profileForm.real_name;
              }
            } else {
              self.$message.error(res.message || '保存失败');
            }
          })
          .catch(function(err) { self.$message.error(err.message || '保存失败'); })
          .finally(function() { self.profileSaving = false; });
      },

      // ---------- 工具方法 ----------
      getCategoryTagType: function(category) {
        var map = { '港澳台同胞': '', '海外侨胞': 'success', '归国华侨': 'warning', '侨眷': 'info', '社团领袖': 'danger', '专家学者': '', '企业家': 'success', '青年代表': 'warning' };
        return map[category] || '';
      },

      getFieldLabel: function(key) {
        if (fieldLabels[key]) return fieldLabels[key];
        return key.replace(/_/g, ' ');
      },

      formatFieldValue: function(key, val) {
        if (val === null || val === undefined || val === '') return '-';
        if (typeof val === 'object') return JSON.stringify(val, null, 2);
        return String(val);
      },

      // ========== AI Chat 方法 ==========
      loadChatModels: function() {
        var self = this;
        axios.get(API_PREFIX + '/chat/models', {
          headers: { 'Authorization': 'Bearer ' + getToken() }
        }).then(function(res) {
          if (res.data && res.data.data) {
            self.chatModels = res.data.data;
            if (self.chatModels.length && !self.chatModel) {
              self.chatModel = self.chatModels[0].id;
            }
          }
        }).catch(function() {
          // 使用默认模型
          self.chatModels = [{ id: 'deepseek-chat', name: 'DeepSeek Chat' }];
        });
      },

      startNewChat: function() {
        this.chatMessages = [];
        this.chatInputText = '';
        this.chatFiles = [];
        this.activeMentions = [];
        this.chatConversationId = 'conv_' + Date.now();
        var self = this;
        axios.post(API_PREFIX + '/chat/clear', { conversation_id: this.chatConversationId }, {
          headers: { 'Authorization': 'Bearer ' + getToken() }
        }).catch(function() {});
      },

      sendChatMessage: function() {
        var self = this;
        var text = this.chatInputText.trim();
        if (!text && !this.chatFiles.length) return;
        if (this.chatLoading) return;

        var now = new Date();
        var timeStr = (now.getMonth() + 1) + '/' + now.getDate() + ' ' + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();

        // 添加用户消息
        this.chatMessages.push({
          role: 'user',
          content: text,
          time: timeStr,
          mentions: this.activeMentions.slice()
        });

        this.chatInputText = '';
        this.showMentionMenu = false;
        this.chatLoading = true;
        this.scrollToBottom();

        // 准备文件内容
        var filesData = this.chatFiles.map(function(f) {
          return { filename: f.filename, content: f.content || '' };
        });

        axios.post(API_PREFIX + '/chat/send', {
          model: this.chatModel,
          message: text,
          conversation_id: this.chatConversationId,
          files: filesData,
          mentions: this.activeMentions
        }, {
          headers: { 'Authorization': 'Bearer ' + getToken() },
          timeout: 60000
        }).then(function(res) {
          var replyContent = '';
          if (res.data && res.data.data) {
            replyContent = res.data.data.content || res.data.data.reply || JSON.stringify(res.data.data);
          } else if (res.data && res.data.message) {
            replyContent = res.data.message;
          } else {
            replyContent = '收到回复';
          }
          var now2 = new Date();
          var timeStr2 = (now2.getMonth() + 1) + '/' + now2.getDate() + ' ' + now2.getHours() + ':' + (now2.getMinutes() < 10 ? '0' : '') + now2.getMinutes();
          self.chatMessages.push({
            role: 'assistant',
            content: replyContent,
            time: timeStr2,
            model: self.chatModel
          });
        }).catch(function(err) {
          var errMsg = (err.response && err.response.data && err.response.data.message) || err.message || '网络请求失败，请稍后重试';
          var now2 = new Date();
          var timeStr2 = (now2.getMonth() + 1) + '/' + now2.getDate() + ' ' + now2.getHours() + ':' + (now2.getMinutes() < 10 ? '0' : '') + now2.getMinutes();
          self.chatMessages.push({
            role: 'assistant',
            content: '抱歉，发生了错误：' + errMsg,
            time: timeStr2,
            model: self.chatModel
          });
        }).finally(function() {
          self.chatLoading = false;
          self.chatFiles = [];
          self.activeMentions = [];
          self.scrollToBottom();
        });
      },

      insertMention: function(key) {
        var textarea = this.$refs.chatInput;
        var text = this.chatInputText;
        var cursorPos = textarea ? textarea.selectionStart : text.length;
        var insertText = key + ' ';
        this.chatInputText = text.slice(0, cursorPos) + insertText + text.slice(cursorPos);
        if (this.activeMentions.indexOf(key) === -1) {
          this.activeMentions.push(key);
        }
        this.$nextTick(function() {
          if (textarea) {
            textarea.focus();
            var newPos = cursorPos + insertText.length;
            textarea.setSelectionRange(newPos, newPos);
          }
        });
      },

      checkMention: function() {
        var text = this.chatInputText;
        var cursorPos = this.$refs.chatInput ? this.$refs.chatInput.selectionStart : text.length;
        // 找到光标前最后一个 @ 符号
        var atIdx = -1;
        for (var i = cursorPos - 1; i >= 0; i--) {
          if (text[i] === '@') {
            atIdx = i;
            break;
          }
          if (text[i] === ' ' || text[i] === '\n') break;
        }
        if (atIdx > -1) {
          this.mentionStartPos = atIdx;
          this.mentionQuery = text.slice(atIdx + 1, cursorPos);
          this.showMentionMenu = true;
          this.mentionSelectedIdx = 0;
        } else {
          this.showMentionMenu = false;
          this.mentionQuery = '';
        }
      },

      selectMention: function(tag) {
        var text = this.chatInputText;
        var cursorPos = this.$refs.chatInput ? this.$refs.chatInput.selectionStart : text.length;
        // 替换 @query 为 @tag.label
        var before = text.slice(0, this.mentionStartPos);
        var after = text.slice(cursorPos);
        this.chatInputText = before + tag.label + ' ' + after;
        this.showMentionMenu = false;
        this.mentionQuery = '';
        if (this.activeMentions.indexOf(tag.label) === -1) {
          this.activeMentions.push(tag.label);
        }
        this.$nextTick(function() {
          if (this.$refs.chatInput) {
            this.$refs.chatInput.focus();
          }
        }.bind(this));
      },

      handleChatKeydown: function(e) {
        if (this.showMentionMenu) {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            this.mentionSelectedIdx = Math.min(this.mentionSelectedIdx + 1, this.filteredMentionTags.length - 1);
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            this.mentionSelectedIdx = Math.max(this.mentionSelectedIdx - 1, 0);
          } else if (e.key === 'Enter' || e.key === 'Tab') {
            e.preventDefault();
            if (this.filteredMentionTags.length > 0) {
              this.selectMention(this.filteredMentionTags[this.mentionSelectedIdx]);
            }
          } else if (e.key === 'Escape') {
            this.showMentionMenu = false;
          }
          return;
        }
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          this.sendChatMessage();
        }
      },

      triggerFileUpload: function() {
        if (this.$refs.chatFileInput) {
          this.$refs.chatFileInput.click();
        }
      },

      handleChatFileSelect: function(e) {
        var self = this;
        var files = e.target.files;
        if (!files || !files.length) return;
        for (var i = 0; i < files.length; i++) {
          (function(file) {
            var formData = new FormData();
            formData.append('file', file);
            axios.post(API_PREFIX + '/chat/upload', formData, {
              headers: {
                'Authorization': 'Bearer ' + getToken(),
                'Content-Type': 'multipart/form-data'
              }
            }).then(function(res) {
              self.chatFiles.push({
                filename: file.name,
                content: (res.data && res.data.data && res.data.data.content) || '',
                fileId: (res.data && res.data.data && res.data.data.file_id) || null
              });
            }).catch(function() {
              // 读取失败时仍然显示文件名
              self.chatFiles.push({ filename: file.name, content: '' });
            });
          })(files[i]);
        }
        // 重置 input
        e.target.value = '';
      },

      removeMention: function(tag) {
        var idx = this.activeMentions.indexOf(tag);
        if (idx > -1) {
          this.activeMentions.splice(idx, 1);
        }
        // 从输入框中移除对应的 @tag
        this.chatInputText = this.chatInputText.replace(tag + ' ', '').replace(tag, '');
      },

      usePrompt: function(text) {
        // 先清空已有 @ 引用
        this.activeMentions = [];
        // 解析 text 中的 @ 标签
        var self = this;
        this.chatMentionTags.forEach(function(tag) {
          if (text.indexOf(tag.label) > -1) {
            if (self.activeMentions.indexOf(tag.label) === -1) {
              self.activeMentions.push(tag.label);
            }
          }
        });
        this.chatInputText = text;
        this.$nextTick(function() {
          if (self.$refs.chatInput) {
            self.$refs.chatInput.focus();
          }
        });
      },

      renderMarkdown: function(text) {
        if (!text) return '';
        var html = String(text);
        // 转义 HTML
        html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        // 代码块 ```...```
        html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, function(match, lang, code) {
          return '<pre><code>' + code.trim() + '</code></pre>';
        });
        // 行内代码
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        // 加粗
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        // 斜体
        html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
        // 无序列表
        html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
        html = html.replace(/(<li>.*<\/li>\n?)+/g, function(match) {
          return '<ul>' + match + '</ul>';
        });
        // 有序列表
        html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
        // 换行
        html = html.replace(/\n/g, '<br>');
        // 清理多余的空行
        html = html.replace(/<br>\s*(<\/?(?:ul|ol|pre|li)[^>]*>)/g, '$1');
        html = html.replace(/(<\/(?:ul|ol|pre|li)>)/g, '$1');
        return html;
      },

      scrollToBottom: function() {
        var self = this;
        this.$nextTick(function() {
          var container = self.$refs.chatMessages;
          if (container) {
            container.scrollTop = container.scrollHeight;
          }
        });
      }
    }
  });
})();
</script>
