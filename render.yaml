services:
  - type: web
    name: hkgq-management
    env: python
    buildCommand: pip install --upgrade pip setuptools && pip install -r requirements.txt --ignore-installed blinker
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
